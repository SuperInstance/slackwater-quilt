[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slackwater-quilt"
version = "0.1.0"
description = "The ledger is the build — every slackwater lattice operation as a receipted quilt cell."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Z User" }]
keywords = ["hexagonal", "lattice", "eisenstein", "receipts", "ledger", "quilt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "slackwater-lattice>=0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/SuperInstance/slackwater-quilt"

[tool.setuptools]
packages = ["slackwater_quilt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
